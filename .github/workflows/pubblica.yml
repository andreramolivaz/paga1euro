name: Pubblica

on:
  push:
    branches: [main]
  schedule:
    # Ogni 10 minuti ricontrolla su Stripe quante persone hanno pagato.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pubblica
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GIT_AUTHOR_NAME: github-actions[bot]
      GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@v5

      - name: Conta chi ha pagato e aggiorna il sito
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
        run: bash scripts/pubblica.sh

      # GitHub spegne le esecuzioni pianificate dopo 60 giorni senza commit.
      # Se main è ferma da 50 giorni, un commit minuscolo tiene acceso il contatore.
      - name: Tieni acceso il contatore
        if: github.event_name == 'schedule'
        run: |
          fermo=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$fermo" -gt $(( 50 * 86400 )) ]; then
            date -u +%F > .github/keepalive
            git add .github/keepalive
            git commit --quiet -m "Tieni acceso il contatore"
            git push --quiet origin HEAD:main || echo "Riprovo alla prossima esecuzione."
          fi
